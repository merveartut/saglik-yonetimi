<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <style>
      .bg-blob-1 { fill: #D6E8FA; opacity: 0.6; }
      .bg-blob-2 { fill: #B1D3F7; opacity: 0.7; }
      .leaf { fill: #A5C9F3; opacity: 0.8; }
      
      .phone-bg { fill: #FFFFFF; stroke: #316BB5; stroke-width: 4; rx: 18; }
      .phone-header { fill: #316BB5; }
      .pill-box-bg { fill: #D1E4FA; rx: 10; }
      .pill-icon { fill: #2B62AD; }
      .check-icon { stroke: #80AEE6; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .checkbox-empty { stroke: #C8DCF5; stroke-width: 2.5; fill: none; rx: 2; }
      .line-short { fill: #E1EEFC; rx: 2; }
      
      .clipboard-bg { fill: #FFFFFF; stroke: #8FAFE1; stroke-width: 3; rx: 6; }
      .clipboard-top { fill: #316BB5; rx: 4; }
      .clipboard-clip { fill: #2B62AD; }
      .heart-icon { fill: #356CB4; }
      .ecg-line { stroke: #2B62AD; stroke-dasharray: 2; }
      
      .bag-front { fill: #F5F7FA; }
      .bag-side { fill: #E1E5EC; }
      .bag-fold { fill: #D0D6E0; }
      .bag-handle { stroke: #316BB5; stroke-width: 3; stroke-linecap: round; fill: none; }
      .bag-pill-1 { fill: #D1E4FA; }
      .bag-pill-2 { fill: #A3C9F8; }
      
      .bottle-cap { fill: #FFFFFF; stroke: #D0D7E3; stroke-width: 2; }
      .bottle-body { fill: #316BB5; }
      .bottle-label { fill: #FFFFFF; }
      .bottle-detail { fill: #6597D8; }
      
      .box-top { fill: #CBE0F8; }
      .box-front { fill: #A2C7F5; }
      .box-side { fill: #74A7E8; }
      .box-stripe { fill: #316BB5; }
      
      .blister-bg { fill: #3B72BC; rx: 4; }
      .blister-pocket { fill: #FFFFFF; rx: 3; }
      .blister-pill { fill: #4B82CE; }
    </style>
  </defs>

  <!-- Arka Plan Su Damlası / Yaprak Şekilleri (Background Blobs) -->
  <g id="background">
    <!-- Ana Arka Plan Mavi Alanı -->
    <path class="bg-blob-1" d="M 100 220 C 80 130, 160 50, 260 50 C 370 50, 440 100, 450 200 C 460 300, 380 340, 260 330 C 150 320, 120 280, 100 220 Z" />
    <path class="bg-blob-2" d="M 120 200 C 100 150, 180 80, 250 100 C 320 120, 410 160, 410 240 C 410 300, 310 320, 220 310 C 140 300, 130 230, 120 200 Z" />
    
    <!-- Sol Taraf Yaprak / Estetik Desen (Leaf Illustration) -->
    <path class="leaf" d="M 130 130 C 100 150, 90 200, 110 240 C 120 260, 150 280, 180 270 C 160 250, 150 230, 160 210 C 170 190, 190 190, 180 170 C 170 150, 140 140, 130 130 Z" />
    <path class="leaf" d="M 100 210 C 80 220, 70 250, 85 275 C 100 290, 130 295, 155 285 C 135 275, 125 260, 130 245 C 135 230, 120 215, 100 210 Z" />
  </g>

  <!-- Arka Plandaki Sağ Taraf Doktor Panosu (Clipboard) -->
  <g id="clipboard" transform="translate(280, 95)">
    <!-- Pano Gövdesi -->
    <rect class="clipboard-bg" x="0" y="20" width="110" height="150" rx="6" />
    
    <!-- Pano Klipsi -->
    <path class="clipboard-top" d="M 30 10 L 80 10 C 85 10, 85 25, 80 25 L 30 25 C 25 25, 25 10, 30 10 Z" />
    <circle class="clipboard-clip" cx="55" cy="17" r="6" />
    <circle fill="#FFFFFF" cx="55" cy="17" r="3" />
    
    <!-- Pano İçeriği (Kalp ve Nabız) -->
    <path class="heart-icon" d="M 20 50 C 20 42, 28 38, 34 44 C 40 38, 48 42, 48 50 C 48 60, 34 68, 34 68 C 34 68, 20 60, 20 50 Z" />
    <!-- Nabız Çizgisi (EKG) -->
    <path d="M 24 52 L 28 52 L 30 46 L 33 56 L 36 48 L 38 53 L 44 53" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Satır Çizgileri -->
    <rect fill="#D1E4FA" x="54" y="44" width="40" height="4" rx="2" />
    <rect fill="#D1E4FA" x="54" y="52" width="32" height="4" rx="2" />
    
    <rect fill="#E1EEFC" x="20" y="75" width="74" height="3" rx="1.5" />
    <rect fill="#E1EEFC" x="20" y="84" width="74" height="3" rx="1.5" />
    <rect fill="#E1EEFC" x="20" y="93" width="55" height="3" rx="1.5" />
    
    <!-- Alt Nabız Grafiği -->
    <path d="M 20 120 L 35 120 L 40 105 L 46 130 L 52 110 L 57 124 L 62 118 L 66 120 L 94 120" fill="none" stroke="#8FAFE1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Orta/Sol Akıllı Telefon (Smartphone) -->
  <g id="phone" transform="translate(145, 30)">
    <!-- Telefon Dış Çerçevesi -->
    <rect class="phone-bg" x="0" y="0" width="130" height="260" rx="18" />
    <!-- Alt Çizgi/Home Bar -->
    <rect class="phone-header" x="0" y="242" width="130" height="18" rx="0" />
    
    <!-- İlaç Kutusu / Üst Logo Alanı -->
    <rect class="pill-box-bg" x="26" y="28" width="78" height="48" rx="12" />
    
    <!-- Çapraz İlaç / Hap İkonları (Üst Kutuda) -->
    <g id="phone-pill-icon" transform="translate(45, 40)">
      <!-- Oval Hap -->
      <g transform="rotate(-45, 12, 12)">
        <rect class="pill-icon" x="2" y="2" width="22" height="11" rx="5.5" />
        <line x1="13" y1="2" x2="13" y2="13" stroke="#D1E4FA" stroke-width="1.5" />
      </g>
      <!-- Yuvarlak Hap -->
      <circle class="pill-icon" cx="24" cy="18" r="7" />
      <line x1="19" y1="18" x2="29" y2="18" stroke="#D1E4FA" stroke-width="1.5" />
    </g>
    
    <!-- Checkbox 1 (Onaylı) -->
    <g transform="translate(18, 98)">
      <path class="check-icon" d="M 2 8 L 7 13 L 17 2" />
      <rect class="line-short" x="28" y="4" width="60" height="4" rx="2" />
      <rect class="line-short" x="28" y="13" width="42" height="4" rx="2" />
    </g>
    
    <!-- Checkbox 2 (Onaylı) -->
    <g transform="translate(18, 138)">
      <path class="check-icon" d="M 2 8 L 7 13 L 17 2" />
      <rect class="line-short" x="28" y="4" width="65" height="4" rx="2" />
      <rect class="line-short" x="28" y="13" width="38" height="4" rx="2" />
    </g>
    
    <!-- Checkbox 3 (Boş) -->
    <g transform="translate(18, 178)">
      <rect class="checkbox-empty" x="1" y="0" width="16" height="16" />
      <rect class="line-short" x="28" y="4" width="55" height="4" rx="2" />
      <rect class="line-short" x="28" y="13" width="48" height="4" rx="2" />
    </g>
  </g>

  <!-- Ön Plandaki İlaç Alışveriş Poşeti (Paper Bag) -->
  <g id="shopping-bag" transform="translate(235, 180)">
    <!-- Poşet Yan Yüzeyi (3D Derinlik) -->
    <polygon class="bag-side" points="72,16 95,35 95,175 72,185" />
    <polygon class="bag-fold" points="72,16 83,25 95,35 72,16" />
    
    <!-- Poşet Ön Yüzeyi -->
    <polygon class="bag-front" points="0,32 72,16 72,185 0,165" />
    
    <!-- Poşet Sapı (Handle) -->
    <path class="bag-handle" d="M 20 27 C 20 10, 48 5, 48 21" />
    
    <!-- Poşet Üzerindeki Hap İllüstrasyonu -->
    <g id="bag-pill" transform="translate(18, 80) rotate(-35)">
      <rect class="bag-pill-1" x="0" y="0" width="18" height="32" rx="9" />
      <path class="bag-pill-2" d="M 0 16 L 18 16 L 18 23 C 18 28, 14 32, 9 32 C 4 32, 0 28, 0 23 Z" />
      <line x1="0" y1="16" x2="18" y2="16" stroke="#FFFFFF" stroke-width="1.5" />
    </g>
  </g>

  <!-- Sağ Alt İlaç Kutusu (Medicine Box) -->
  <g id="medicine-box" transform="translate(340, 250)">
    <!-- Kutu Üst Yüzeyi -->
    <polygon class="box-top" points="30,0 90,20 60,35 0,15" />
    <!-- Kutu Ön Yüzeyi -->
    <polygon class="box-front" points="0,15 60,35 60,75 0,55" />
    <!-- Kutu Yan Yüzeyi -->
    <polygon class="box-side" points="60,35 90,20 90,60 60,75" />
    
    <!-- Kutu Detay Çizgileri -->
    <polygon class="box-stripe" points="10,28 50,41 50,46 10,33" />
    <line x1="5" y1="43" x2="35" y2="53" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <line x1="5" y1="49" x2="25" y2="55" stroke="#316BB5" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Sağ Alt İlaç Şişesi (Medicine Bottle) -->
  <g id="bottle" transform="translate(320, 270)">
    <!-- Şişe Gövdesi (Arka Derinlik) -->
    <rect class="bottle-body" x="5" y="18" width="42" height="52" rx="6" />
    <!-- Şişe Kapağı -->
    <rect class="bottle-cap" x="7" y="0" width="38" height="18" rx="4" />
    <line x1="7" y1="6" x2="45" y2="6" stroke="#E1E6F0" stroke-width="1.5" />
    <line x1="7" y1="12" x2="45" y2="12" stroke="#E1E6F0" stroke-width="1.5" />
    
    <!-- Şişe Etiketi -->
    <rect class="bottle-label" x="5" y="24" width="32" height="36" />
    <rect class="bottle-detail" x="9" y="30" width="18" height="3" rx="1.5" />
    <rect class="bottle-detail" x="9" y="36" width="24" height="2.5" rx="1.2" />
    <rect class="bottle-detail" x="9" y="42" width="20" height="2.5" rx="1.2" />
  </g>

  <!-- En Öndeki İlaç Blisteri / Hap Tableti (Pill Blister Pack) -->
  <g id="blister" transform="translate(330, 325) rotate(-5)">
    <!-- Tablet Tabanı -->
    <rect class="blister-bg" x="0" y="0" width="68" height="42" rx="5" />
    
    <!-- Hap Gözleri (2x5 Grid) -->
    <!-- Satır 1 -->
    <rect class="blister-pocket" x="6" y="6" width="9" height="12" rx="4.5" />
    <rect class="blister-pill" x="8" y="8" width="5" height="8" rx="2.5" />
    
    <rect class="blister-pocket" x="18" y="6" width="9" height="12" rx="4.5" />
    <rect class="blister-pill" x="20" y="8" width="5" height="8" rx="2.5" />
    
    <rect class="blister-pocket" x="30" y="6" width="9" height="12" rx="4.5" />
    <rect class="blister-pill" x="32" y="8" width="5" height="8" rx="2.5" />
    
    <rect class="blister-pocket" x="42" y="6" width="9" height="12" rx="4.5" />
    <rect class="blister-pill" x="44" y="8" width="5" height="8" rx="2.5" />
    
    <rect class="blister-pocket" x="53" y="6" width="9" height="12" rx="4.5" />
    <rect class="blister-pill" x="55" y="8" width="5" height="8" rx="2.5" />

    <!-- Satır 2 -->
    <rect class="blister-pocket" x="6" y="24" width="9" height="12" rx="4.5" />
    <rect class="blister-pill" x="8" y="26" width="5" height="8" rx="2.5" />
    
    <rect class="blister-pocket" x="18" y="24" width="9" height="12" rx="4.5" />
    <rect class="blister-pill" x="20" y="26" width="5" height="8" rx="2.5" />
    
    <rect class="blister-pocket" x="30" y="24" width="9" height="12" rx="4.5" />
    <rect class="blister-pill" x="32" y="26" width="5" height="8" rx="2.5" />
    
    <rect class="blister-pocket" x="42" y="24" width="9" height="12" rx="4.5" />
    <rect class="blister-pill" x="44" y="26" width="5" height="8" rx="2.5" />
    
    <rect class="blister-pocket" x="53" y="24" width="9" height="12" rx="4.5" />
    <rect class="blister-pill" x="55" y="26" width="5" height="8" rx="2.5" />
  </g>
</svg>
